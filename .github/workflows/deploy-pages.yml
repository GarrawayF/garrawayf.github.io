name: Deploy Garraway F website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Garraway F source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: site
      - name: Checkout approved social feed and RAMEN TECH guide
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MDL20241119/GarrawayFapp.github.io
          ref: main
          path: published
          sparse-checkout: |
            data
            images/instagram
            ramen-tech-2026
          sparse-checkout-cone-mode: false
      - name: Prepare published content
        shell: bash
        run: |
          mkdir -p site/public/data site/public/images site/public/ramen-tech-2026
          cp -R published/data/. site/public/data/
          if [ -d published/images/instagram ]; then cp -R published/images/instagram site/public/images/; fi
          cp -R published/ramen-tech-2026/. site/public/ramen-tech-2026/
          find site/public/ramen-tech-2026 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.md' \) -print0 | xargs -0 sed -i \
            -e 's#https://mobilitydlab.com/GarrawayFapp.github.io/ramen-tech-2026/#https://garrawayf.github.io/ramen-tech-2026/#g' \
            -e 's#https://mobilitydlab.com/GarrawayFapp.github.io/#https://garrawayf.github.io/#g' \
            -e 's#/GarrawayFapp.github.io/ramen-tech-2026/#/ramen-tech-2026/#g' \
            -e 's#/GarrawayFapp.github.io/#/#g'
          python3 - <<'PY'
          from pathlib import Path
          root=Path('site/public/ramen-tech-2026')
          planner=root/'planner.js'; text=planner.read_text(encoding='utf-8')
          old="duration=a.e.room&&a.e.room===b.e.room?0:3;method=duration?'同じ施設内の移動目安':'同じ部屋';"
          new="duration=0;method='同じ会場・移動なし';"
          if old not in text and new not in text: raise SystemExit('Same-venue rule missing')
          planner.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Assemble redesigned RAMEN TECH guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          root=Path('site/public/ramen-tech-2026'); bundle=root/'v3-bundle'
          def unpack(prefix,target):
              parts=sorted(bundle.glob(prefix+'.*.part'))
              if not parts: raise SystemExit(f'Missing bundle: {prefix}')
              packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              (root/target).write_bytes(gzip.decompress(base64.b64decode(packed)))
          unpack('index_html','index.html'); unpack('guide_css','guide.css'); unpack('guide_js','guide.js')
          js=(root/'guide.js').read_text(encoding='utf-8').replace('この確認版について','このガイドについて').replace('このプレビューは保存データを使い、自動取得処理を実行しません。','このガイドは配信時点の保存データを表示し、閲覧中に自動取得は行いません。')
          (root/'guide.js').write_text(js,encoding='utf-8')
          html=(root/'index.html').read_text(encoding='utf-8')
          classic='<link rel="stylesheet" href="v3-classic.css?v=20260910c1">'
          if classic not in html: html=html.replace('</head>',classic+'</head>')
          (root/'index.html').write_text(html,encoding='utf-8')
          PY
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Check production dependencies
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
      - name: Check source
        working-directory: site
        run: npm run lint
      - name: Build website
        working-directory: site
        run: npm run build
      - name: Smoke-test exported website
        working-directory: site
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('out')
          pages=[out/'index.html',out/'events'/'index.html',out/'contact'/'index.html',out/'privacy'/'index.html']
          for page in pages:
            assert page.is_file(); html=page.read_text(encoding='utf-8'); assert 'プレオープン｜試験公開中' in html; assert 'name="robots"' in html and 'noindex, nofollow' in html
          ramen=out/'ramen-tech-2026'; html=(ramen/'index.html').read_text(encoding='utf-8',errors='ignore')
          assert 'RAMEN TECH 2026 非公式回遊ガイド｜Garraway F' in html
          assert 'window.GUIDE_CONFIG={preview:false' in html
          assert 'v3-classic.css?v=20260910c1' in html and (ramen/'v3-classic.css').is_file()
          guide=(ramen/'guide.js').read_text(encoding='utf-8',errors='ignore')
          for marker in ['plan-map','マイ予定','当日ナビ','このガイドについて']: assert marker in guide or marker in html
          assert 'このプレビューは保存データを使い' not in guide
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in out.rglob('*') if p.is_file() and p.suffix in {'.html','.js','.css','.json','.txt'})
          assert '/GarrawayFapp.github.io' not in text and 'mobilitydlab.com/GarrawayFapp.github.io' not in text
          assert '2019garrawf@gmail.com' not in text and '2019garrawayf@gmail.com' not in text
          instagram=json.loads((out/'data'/'instagram.json').read_text(encoding='utf-8')); assert instagram.get('includes_tagged_posts') is False and instagram.get('includes_stories') is False
          print('Smoke test passed: improved UX + classic RAMEN TECH visual language')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/out
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
