name: Deploy Garraway F website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          path: deployment

      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          repository: MDL20241119/GarrawayFapp.github.io
          ref: sites-source
          path: site

      - name: Checkout current social feed
        uses: actions/checkout@v4
        with:
          repository: MDL20241119/GarrawayFapp.github.io
          ref: main
          path: published
          sparse-checkout: |
            data
            images/instagram
          sparse-checkout-cone-mode: false

      - name: Prepare root-path build
        shell: bash
        run: |
          mkdir -p site/vendor site/public/data site/public/images
          cp deployment/vendor/shadcn-tailwind-4.13.0.css site/vendor/
          cp deployment/next.config.mjs site/next.config.mjs
          cp -R published/data/. site/public/data/
          if [ -d published/images/instagram ]; then
            cp -R published/images/instagram site/public/images/
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build website
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
