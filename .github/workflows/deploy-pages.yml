name: Deploy Garraway F website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}
concurrency:
  group: garrawayf-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Garraway F source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: site
      - name: Checkout approved social feed and RAMEN TECH guide
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MDL20241119/GarrawayFapp.github.io
          ref: main
          path: published
          sparse-checkout: |
            data
            images/instagram
            ramen-tech-2026
          sparse-checkout-cone-mode: false
      - name: Prepare published content
        shell: bash
        run: |
          mkdir -p site/public/data site/public/images site/public/ramen-tech-2026
          cp -R published/data/. site/public/data/
          if [ -d published/images/instagram ]; then cp -R published/images/instagram site/public/images/; fi
          cp -R published/ramen-tech-2026/. site/public/ramen-tech-2026/
          find site/public/ramen-tech-2026 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.md' \) -print0 | xargs -0 sed -i \
            -e 's#https://mobilitydlab.com/GarrawayFapp.github.io/ramen-tech-2026/#https://garrawayf.github.io/ramen-tech-2026/#g' \
            -e 's#https://mobilitydlab.com/GarrawayFapp.github.io/#https://garrawayf.github.io/#g' \
            -e 's#/GarrawayFapp.github.io/ramen-tech-2026/#/ramen-tech-2026/#g' \
            -e 's#/GarrawayFapp.github.io/#/#g'
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('site/public/ramen-tech-2026')
          feature=root/'kyushu'
          manifest=json.loads((feature/'image-manifest.json').read_text())
          for filename in manifest['removedExternalPhotoFiles'] + manifest.get('retiredGeneratedFiles', []):
              assert Path(filename).name == filename
              previous=feature/'images'/filename
              if previous.is_file(): previous.unlink()
          planner=root/'planner.js'; text=planner.read_text(encoding='utf-8')
          old="duration=a.e.room&&a.e.room===b.e.room?0:3;method=duration?'同じ施設内の移動目安':'同じ部屋';"
          new="duration=0;method='同じ会場・移動なし';"
          if old not in text and new not in text: raise SystemExit('Same-venue rule missing')
          planner.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Test publication verifier
        run: python3 -m unittest discover -s site/.github/scripts -p 'test_*.py' -v
      - name: Verify and refresh flight timetables
        shell: bash
        run: |
          node published/ramen-tech-2026/tests/access-planner.test.cjs
          if ! timeout 240s python3 site/public/ramen-tech-2026/scripts/update-flight-data.py; then
            echo "::warning::Airport timetable refresh unavailable; keeping the dated verified snapshot."
            test -s site/public/ramen-tech-2026/flight-data.js
          fi
          node --check site/public/ramen-tech-2026/flight-data.js
          node --check site/public/ramen-tech-2026/flight-monthly.js
      - name: Assemble redesigned RAMEN TECH guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          root=Path('site/public/ramen-tech-2026'); bundle=root/'v3-bundle'
          def unpack(prefix,target):
              parts=sorted(bundle.glob(prefix+'.*.part'))
              if not parts: raise SystemExit(f'Missing bundle: {prefix}')
              packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              (root/target).write_bytes(gzip.decompress(base64.b64decode(packed)))
          unpack('index_html','index.html'); unpack('guide_css','guide.css'); unpack('guide_js','guide.js')
          js=(root/'guide.js').read_text(encoding='utf-8').replace('この確認版について','このガイドについて').replace('このプレビューは保存データを使い、自動取得処理を実行しません。','このガイドは配信時点の保存データを表示し、閲覧中に自動取得は行いません。')
          (root/'guide.js').write_text(js,encoding='utf-8')
          html=(root/'index.html').read_text(encoding='utf-8')
          classic='<link rel="stylesheet" href="v3-classic.css?v=20260911f1"><script src="classic-ui.js?v=20260912k4" defer></script><script src="flight-data.js?v=20260911f1" defer></script><script src="flight-monthly.js?v=20260911f1" defer></script><script src="access-planner.js?v=20260911f1" defer></script><meta name="garraway-ui-version" content="20260911f1">'
          html=html.replace('<meta name="theme-color" content="#f7f7f2">','<meta name="theme-color" content="#1892F5">')
          if classic not in html: html=html.replace('</head>',classic+'</head>')
          (root/'index.html').write_text(html,encoding='utf-8')
          PY
          python3 site/public/ramen-tech-2026/scripts/prepare-live-guide.py --site site/public/ramen-tech-2026
          node --check site/public/ramen-tech-2026/live-data.js
          node site/public/ramen-tech-2026/tests/live-data.test.cjs
          node site/public/ramen-tech-2026/tests/guide-ux.test.cjs site/public/ramen-tech-2026
          node --check site/public/ramen-tech-2026/guide.js
          node --check site/public/ramen-tech-2026/classic-ui.js
          node --check site/public/ramen-tech-2026/access-planner.js
          node --check site/public/ramen-tech-2026/kyushu/kyushu.js
          python3 site/public/ramen-tech-2026/kyushu/build-page.py
          python3 site/public/ramen-tech-2026/tests/kyushu-compliance.test.py
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Check production dependencies
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
      - name: Check source
        working-directory: site
        run: npm run lint
      - name: Build website
        working-directory: site
        run: npm run build
      - name: Smoke-test exported website
        working-directory: site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          out=Path('out'); ramen=out/'ramen-tech-2026'
          html=(ramen/'index.html').read_text(encoding='utf-8',errors='ignore')
          assert 'RAMEN TECH 2026 非公式回遊ガイド｜Garraway F' in html
          assert 'window.GUIDE_CONFIG={preview:false' in html
          assert 'live-data.js?v=' in html
          import json
          snapshot=json.loads((ramen/'catalog.json').read_text())
          status=json.loads((ramen/'sync-status.json').read_text())
          assert snapshot['meta']['catalogVersion']==status['catalogVersion']
          assert snapshot['meta']['duplicateAliases']>=11
          assert 'classic-ui.js?v=20260912k4' in html
          assert 'access-planner.js?v=20260911f1' in html
          assert 'flight-data.js?v=20260911f1' in html
          assert 'flight-monthly.js?v=20260911f1' in html
          access=(ramen/'access-planner.js').read_text(encoding='utf-8')
          for marker in ['行き｜このイベントに間に合う','帰り｜このイベント後に帰る','最初のイベント','最後のイベント','東京','大阪','placeAfterPlanContent']: assert marker in access, marker
          classic=(ramen/'classic-ui.js').read_text(encoding='utf-8')
          assert 'ensureRoadMap' in classic
          assert "'kyushu/'" in classic
          autumn=(ramen/'kyushu/index.html').read_text(encoding='utf-8')
          assert 'garraway-kyushu-version' in autumn and '20260912k4' in autumn
          assert '福岡に来たら、' in autumn and '九州まで遊ぼう。' in autumn
          assert 'id="event-grid"' in autumn and 'id="event-dialog"' in autumn
          print('Smoke test passed: visible event-first round-trip travel finder below My Plan')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Inspect GitHub Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
        run: |
          publishing_type=$(gh api "repos/$PAGES_REPOSITORY/pages" --jq '.build_type')
          echo "GitHub Pages publishing source: $publishing_type"
          if [ "$publishing_type" != "workflow" ]; then
            echo "::warning::Set Settings > Pages > Source to GitHub Actions to prevent the branch publisher from replacing the built website."
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/out
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public website and RAMEN TECH match this build
        timeout-minutes: 15
        # urllib's socket timeout cannot bound a continuously trickling response.
        run: timeout --verbose --kill-after=5s 12m python3 -u site/.github/scripts/verify-publication.py
