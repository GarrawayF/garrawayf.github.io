name: Deploy Garraway F website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}
concurrency:
  group: garrawayf-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Garraway F source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: site
      - name: Checkout RAMEN TECH guide and Instagram snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MDL20241119/GarrawayFapp.github.io
          ref: main
          path: published
          sparse-checkout: |
            ramen-tech-2026/
            data/instagram.json
            data/instagram-sync-status.json
            images/instagram/
          sparse-checkout-cone-mode: false
      - name: Prepare RAMEN TECH guide
        shell: bash
        run: |
          mkdir -p site/public/ramen-tech-2026
          cp -R published/ramen-tech-2026/. site/public/ramen-tech-2026/
          find site/public/ramen-tech-2026 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.md' \) -print0 | xargs -0 sed -i \
            -e 's#https://mobilitydlab.com/GarrawayFapp.github.io/ramen-tech-2026/#https://garrawayf.github.io/ramen-tech-2026/#g' \
            -e 's#https://mobilitydlab.com/GarrawayFapp.github.io/#https://garrawayf.github.io/#g' \
            -e 's#/GarrawayFapp.github.io/ramen-tech-2026/#/ramen-tech-2026/#g' \
            -e 's#/GarrawayFapp.github.io/#/#g'
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('site/public/ramen-tech-2026')
          feature=root/'kyushu'
          manifest=json.loads((feature/'image-manifest.json').read_text())
          for filename in manifest['removedExternalPhotoFiles'] + manifest.get('retiredGeneratedFiles', []):
              assert Path(filename).name == filename
              previous=feature/'images'/filename
              if previous.is_file(): previous.unlink()
          planner=root/'planner.js'; text=planner.read_text(encoding='utf-8')
          old="duration=a.e.room&&a.e.room===b.e.room?0:3;method=duration?'同じ施設内の移動目安':'同じ部屋';"
          new="duration=0;method='同じ会場・移動なし';"
          if old not in text and new not in text: raise SystemExit('Same-venue rule missing')
          planner.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Prepare the verified Instagram snapshot
        run: python3 site/.github/scripts/prepare_instagram.py site published "$(git -C published rev-parse HEAD)"
      - name: Test publication verifier
        run: python3 -m unittest discover -s site/.github/scripts -p 'test_*.py' -v
      - name: Verify and refresh flight timetables
        shell: bash
        run: |
          node published/ramen-tech-2026/tests/access-planner.test.cjs
          if ! timeout 240s python3 site/public/ramen-tech-2026/scripts/update-flight-data.py; then
            echo "::warning::Airport timetable refresh unavailable; keeping the dated verified snapshot."
            test -s site/public/ramen-tech-2026/flight-data.js
          fi
          node --check site/public/ramen-tech-2026/flight-data.js
          node --check site/public/ramen-tech-2026/flight-monthly.js
      - name: Assemble redesigned RAMEN TECH guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          root=Path('site/public/ramen-tech-2026'); bundle=root/'v3-bundle'
          def unpack(prefix,target):
              parts=sorted(bundle.glob(prefix+'.*.part'))
              if not parts: raise SystemExit(f'Missing bundle: {prefix}')
              packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              (root/target).write_bytes(gzip.decompress(base64.b64decode(packed)))
          unpack('index_html','index.html'); unpack('guide_css','guide.css'); unpack('guide_js','guide.js')
          js=(root/'guide.js').read_text(encoding='utf-8').replace('この確認版について','このガイドについて').replace('このプレビューは保存データを使い、自動取得処理を実行しません。','このガイドは配信時点の保存データを表示し、閲覧中に自動取得は行いません。')
          (root/'guide.js').write_text(js,encoding='utf-8')
          html=(root/'index.html').read_text(encoding='utf-8')
          classic='<link rel="stylesheet" href="v3-classic.css?v=20260911f1"><script src="classic-ui.js?v=20260912k4" defer></script><script src="flight-data.js?v=20260911f1" defer></script><script src="flight-monthly.js?v=20260911f1" defer></script><script src="access-planner.js?v=20260911f1" defer></script><meta name="garraway-ui-version" content="20260911f1">'
          html=html.replace('<meta name="theme-color" content="#f7f7f2">','<meta name="theme-color" content="#1892F5">')
          if classic not in html: html=html.replace('</head>',classic+'</head>')
          (root/'index.html').write_text(html,encoding='utf-8')
          PY
          python3 site/public/ramen-tech-2026/scripts/prepare-live-guide.py --site site/public/ramen-tech-2026
          node --check site/public/ramen-tech-2026/live-data.js
          node site/public/ramen-tech-2026/tests/live-data.test.cjs
          node site/public/ramen-tech-2026/tests/guide-ux.test.cjs site/public/ramen-tech-2026
          node --check site/public/ramen-tech-2026/guide.js
          node --check site/public/ramen-tech-2026/classic-ui.js
          node --check site/public/ramen-tech-2026/access-planner.js
          node --check site/public/ramen-tech-2026/kyushu/kyushu.js
          python3 site/public/ramen-tech-2026/kyushu/build-page.py
          python3 site/public/ramen-tech-2026/tests/kyushu-compliance.test.py
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Test event application async feedback
        run: node site/.github/scripts/test_github_applicant.mjs
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Check production dependencies
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
      - name: Check source
        working-directory: site
        run: npm run lint
      - name: Build website
        working-directory: site
        run: npm run build
      - name: Smoke-test exported website
        working-directory: site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          out=Path('out'); ramen=out/'ramen-tech-2026'
          for route in ('index.html', 'events/index.html'):
              page=(out/route).read_text(encoding='utf-8')
              assert 'id="upcoming-events"' in page, route
              assert 'facebook.com/plugins/page.php' not in page, route
          for retired in ('data/instagram.json', 'data/instagram-sync-status.json', 'data/facebook-events.json', 'images/instagram'):
              assert not (out/retired).exists(), retired
          assert (out/'instagram-feed/status.json').is_file()
          html=(ramen/'index.html').read_text(encoding='utf-8',errors='ignore')
          assert 'RAMEN TECH 2026 非公式回遊ガイド｜Garraway F' in html
          assert 'window.GUIDE_CONFIG={preview:false' in html
          assert 'live-data.js?v=' in html
          import json
          snapshot=json.loads((ramen/'catalog.json').read_text())
          status=json.loads((ramen/'sync-status.json').read_text())
          assert snapshot['meta']['catalogVersion']==status['catalogVersion']
          assert snapshot['meta']['duplicateAliases']>=11
          assert 'classic-ui.js?v=20260912k4' in html
          assert 'access-planner.js?v=20260911f1' in html
          assert 'flight-data.js?v=20260911f1' in html
          assert 'flight-monthly.js?v=20260911f1' in html
          access=(ramen/'access-planner.js').read_text(encoding='utf-8')
          for marker in ['行き｜このイベントに間に合う','帰り｜このイベント後に帰る','最初のイベント','最後のイベント','東京','大阪','placeAfterPlanContent']: assert marker in access, marker
          classic=(ramen/'classic-ui.js').read_text(encoding='utf-8')
          assert 'ensureRoadMap' in classic
          assert "'kyushu/'" in classic
          autumn=(ramen/'kyushu/index.html').read_text(encoding='utf-8')
          assert 'garraway-kyushu-version' in autumn and '20260912k4' in autumn
          assert '福岡に来たら、' in autumn and '九州まで遊ぼう。' in autumn
          assert 'id="event-grid"' in autumn and 'id="event-dialog"' in autumn
          print('Smoke test passed: visible event-first round-trip travel finder below My Plan')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Inspect GitHub Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
        run: |
          publishing_type=$(gh api "repos/$PAGES_REPOSITORY/pages" --jq '.build_type')
          echo "GitHub Pages publishing source: $publishing_type"
          if [ "$publishing_type" != "workflow" ]; then
            echo "::warning::Set Settings > Pages > Source to GitHub Actions to prevent the branch publisher from replacing the built website."
          fi
      - name: Upload website
        id: pages_upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/out
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact to be listed
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        shell: bash
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..8}; do
            if response=$(timeout 6s gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f "name=$ARTIFACT_NAME" -F per_page=2); then
              count=$(jq -er '.total_count | numbers' <<< "$response")
              if (( count > 1 )); then
                echo "::error::Multiple Pages artifacts share the name of this attempt."
                exit 1
              fi
              if (( count == 1 )) && jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" '
                (.artifacts | length) == 1 and
                (.artifacts[0] | (.id | tostring) == $id and
                  .name == $name and .expired == false and .size_in_bytes > 0)
              ' <<< "$response" > /dev/null; then
                echo "Pages artifact is ready on check $attempt."
                exit 0
              fi
            fi
            if (( attempt < 8 )); then sleep 5; fi
          done
          echo "::error::The uploaded Pages artifact did not become visible. Deployment was skipped."
          exit 1
      - name: Deploy website by verified artifact ID
        id: deployment
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import re
          import signal
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlsplit
          from urllib.request import Request, urlopen
          
          # The public Actions REST API confirms this exact artifact. deploy-pages v4/v5
          # then uses a different, runtime-scoped artifact listing which has returned zero
          # for the same existing artifact. The documented Pages REST API accepts its ID.
          class ApiError(RuntimeError):
              def __init__(self, status, request_id):
                  self.status = status
                  super().__init__(f"HTTP {status}; request ID: {request_id}")
          
          def request_json(url, token, method="GET", payload=None, github_api=True):
              headers = {"Authorization": "Bearer " + token,
                         "Accept": "application/vnd.github+json" if github_api else "application/json"}
              if github_api:
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              req = Request(url, headers=headers, method=method,
                            data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  with urlopen(req, timeout=20) as response:
                      body = response.read(2 * 1024 * 1024 + 1)
                      if len(body) > 2 * 1024 * 1024:
                          raise RuntimeError("API response too large")
                      return json.loads(body) if body else {}
              except HTTPError as exc:
                  request_id = exc.headers.get("x-github-request-id", "unknown")
                  status = exc.code
                  exc.close()
                  # Never print response bodies, authorization headers, or OIDC tokens.
                  raise ApiError(status, request_id) from None
              except (URLError, TimeoutError, OSError):
                  raise RuntimeError("API transport failed; request outcome may be unknown") from None
          
          def validate_artifact(artifact, expected_id, expected_name, run_id, sha, repo_id):
              run = artifact.get("workflow_run") or {}
              if not (
                  str(artifact.get("id")) == expected_id and artifact.get("name") == expected_name
                  and artifact.get("expired") is False
                  and 0 < artifact.get("size_in_bytes", 0) <= 1024 ** 3
                  and str(run.get("id")) == run_id and run.get("head_sha") == sha
                  and str(run.get("repository_id")) == repo_id
                  and str(run.get("head_repository_id")) == repo_id
                  and run.get("head_branch") == "main"
              ):
                  raise RuntimeError("Artifact identity, ownership, size, or revision mismatch; refusing deployment")
          
          def stop(signum, frame):
              raise InterruptedError("Deployment interrupted")
          
          def main():
              repo = os.environ["GITHUB_REPOSITORY"]
              sha = os.environ["GITHUB_SHA"]
              run_id = os.environ["GITHUB_RUN_ID"]
              repo_id = os.environ["GITHUB_REPOSITORY_ID"]
              artifact_id = os.environ["ARTIFACT_ID"]
              name = os.environ["ARTIFACT_NAME"]
              if not re.fullmatch(r"[0-9]+", artifact_id) or not re.fullmatch(r"[a-f0-9]{40}", sha):
                  raise RuntimeError("Invalid artifact ID or commit SHA")
              if os.environ["GITHUB_REF"] != "refs/heads/main":
                  raise RuntimeError("Only main may publish")
              if name != "github-pages-" + run_id + "-" + os.environ["GITHUB_RUN_ATTEMPT"]:
                  raise RuntimeError("Unexpected artifact name")
              api = os.environ["GITHUB_API_URL"].rstrip("/") + "/repos/" + repo
              token = os.environ["GH_TOKEN"]
              # Use the same run-scoped listing as the visibility gate. The per-ID
            # endpoint can still return 404 just after the artifact appears here.
            listing = request_json(api + "/actions/runs/" + run_id + "/artifacts?per_page=2&name=" + quote(name, safe=""), token)
            candidates = listing.get("artifacts")
            if listing.get("total_count") != 1 or not isinstance(candidates, list) or len(candidates) != 1:
                raise RuntimeError("The expected run-scoped Pages artifact is missing or ambiguous")
            artifact = candidates[0]
              validate_artifact(artifact, artifact_id, name, run_id, sha, repo_id)
              print(f"Verified exact artifact ID {artifact_id} for {sha}", flush=True)
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              oidc = request_json(oidc_url, os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"], github_api=False).get("value")
              if not isinstance(oidc, str) or not oidc:
                  raise RuntimeError("OIDC token missing")
              # Do not retry this POST automatically: a lost response may still have created a deployment.
              created = request_json(api + "/pages/deployments", token, "POST", {
                  "artifact_id": int(artifact_id), "pages_build_version": sha,
                  "oidc_token": oidc, "environment": "github-pages",
              })
              del oidc
              deployment_id = str(created.get("id", ""))
              if not re.fullmatch(r"[A-Za-z0-9_-]+", deployment_id):
                  raise RuntimeError("Pages API did not return a usable deployment ID")
              endpoint = api + "/pages/deployments/" + quote(deployment_id, safe="")
              print(f"Created Pages deployment {deployment_id}", flush=True)
              pending = True
              terminal_failures = {"deployment_failed", "deployment_content_failed",
                                   "deployment_cancelled", "deployment_lost"}
              signal.signal(signal.SIGTERM, stop)
              signal.signal(signal.SIGINT, stop)
              deadline = time.monotonic() + 540
              delay = 5
              try:
                  while time.monotonic() < deadline:
                      try:
                          status = request_json(endpoint, token).get("status")
                          print(f"Pages status: {status}", flush=True)
                          if status == "succeed":
                              pending = False
                              page = created.get("page_url", "")
                              parsed = urlsplit(page)
                              if parsed.scheme == "https" and parsed.netloc and "\n" not in page and "\r" not in page:
                                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                                      out.write("page_url=" + page + "\n")
                              print("PAGES DEPLOYMENT SUCCEEDED", flush=True)
                              return
                          if status in terminal_failures:
                              pending = False
                              raise ValueError("Pages deployment failed: " + status)
                      except ApiError as exc:
                          if exc.status not in (404, 429, 500, 502, 503, 504):
                              raise
                          print(f"Temporary status error: {exc}", flush=True)
                      except RuntimeError as exc:
                          if str(exc) != "API transport failed; request outcome may be unknown":
                              raise
                          print("Temporary status transport error", flush=True)
                      time.sleep(min(delay, max(0, deadline - time.monotonic())))
                      delay = min(delay * 1.5, 20)
                  raise TimeoutError("Pages deployment did not report success within nine minutes")
              finally:
                  if pending:
                      try:
                          request_json(endpoint + "/cancel", token, "POST")
                          print(f"Cancelled incomplete deployment {deployment_id}", flush=True)
                      except (RuntimeError, ValueError):
                          print(f"Could not confirm cancellation of deployment {deployment_id}", flush=True)
          
          if __name__ == "__main__":
              # Fail closed on mismatched artifact identity before any live deployment.
              fixture = {"id": 12, "name": "expected", "expired": False, "size_in_bytes": 17,
                         "workflow_run": {"id": 34, "head_sha": "abc", "repository_id": 56,
                                          "head_repository_id": 56, "head_branch": "main"}}
              validate_artifact(fixture, "12", "expected", "34", "abc", "56")
              for key, bad in (("id", 13), ("name", "wrong"), ("expired", True), ("size_in_bytes", 0)):
                  try:
                      validate_artifact(dict(fixture, **{key: bad}), "12", "expected", "34", "abc", "56")
                  except RuntimeError:
                      pass
                  else:
                      raise AssertionError("Artifact validation regression: " + key)
              try:
                  validate_artifact(fixture, "12", "expected", "99", "abc", "56")
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("Cross-run artifact validation regression")
              print("Artifact identity regression checks passed", flush=True)
              main()
          PY
      - name: Verify public website and RAMEN TECH match this build
        timeout-minutes: 15
        # urllib's socket timeout cannot bound a continuously trickling response.
        run: timeout --verbose --kill-after=5s 12m python3 -u site/.github/scripts/verify-publication.py

