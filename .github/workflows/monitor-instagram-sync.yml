name: Monitor Instagram sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout watchdog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check schedule, acquisition, and publication independently
        run: python3 .github/scripts/check-instagram-sync.py
