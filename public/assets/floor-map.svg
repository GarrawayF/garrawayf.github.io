<title id="title">GarrawayF 天神CLASS 3階 フロアマップ</title>
<desc id="desc">添付資料に忠実に再構成したフロアマップ。リビングラボ80席以上、会議室1・2、受付、モノづくりラボ32席、スタジオ、集中スペース30席、ダイニング、キッチン、Serendipity Street、エントランス、エレベーター。</desc>
