    if (required === false) return { ...record, label: "\u30C8\u30E8\u30BF\u78BA\u8A8D\u4E0D\u8981", category: "not-required", priority: 5, question: base.question || "\u78BA\u8A8D\u4E0D\u8981\u306E\u7406\u7531\u3092\u78BA\u8A8D\u3059\u308B" };
    if (status === "requested") return { ...record, label: "\u30C8\u30E8\u30BF\u78BA\u8A8D\u4F9D\u983C\u4E2D", category: status, priority: 0, actionable: true, question: base.question || "\u4F9D\u983C\u3055\u308C\u305F\u5224\u65AD\u4E8B\u9805\u3092\u78BA\u8A8D\u3059\u308B" };
    if (status === "not-requested") return { ...record, label: "\u30C8\u30E8\u30BF\u78BA\u8A8D\u304C\u5FC5\u8981\u30FB\u672A\u4F9D\u983C", category: status, priority: 2, question: base.question || "\u30C8\u30E8\u30BF\u3078\u306E\u78BA\u8A8D\u4F9D\u983C\u3092\u6E96\u5099\u3059\u308B" };
    if (status === "approved") return { ...record, label: "\u30C8\u30E8\u30BF\u627F\u8A8D\u8A18\u9332\u3042\u308A", category: status, priority: 5, question: base.question || "\u30C8\u30E8\u30BF\u306E\u627F\u8A8D\u8A18\u9332\u3092\u78BA\u8A8D\u3059\u308B" };
    if (status === "rejected") return { ...record, label: "\u30C8\u30E8\u30BF\u5426\u8A8D\u8A18\u9332\u3042\u308A", category: status, priority: 5, question: base.question || "\u30C8\u30E8\u30BF\u306E\u5426\u8A8D\u7406\u7531\u3092\u78BA\u8A8D\u3059\u308B" };
    return { ...record, label: "\u30C8\u30E8\u30BF\u78BA\u8A8D\u306E\u72B6\u6CC1\u672A\u78BA\u8A8D", question: base.question || "\u30C8\u30E8\u30BF\u3078\u306E\u4F9D\u983C\u30FB\u5224\u65AD\u72B6\u6CC1\u3092\u78BA\u8A8D\u3059\u308B" };
  }

  // src/app.js
  var D = JSON.parse(document.querySelector("#data").textContent);
  var app = document.querySelector("#app");
  var roles = { concierge: "\u30B3\u30F3\u30B7\u30A7\u30EB\u30B8\u30E5", okami: "\u5973\u5C06", toyota: "\u30C8\u30E8\u30BF" };
  var role = "concierge";
  var selected = null;
  var filter = "all";
  var sort = "date";
  var direction = 1;
  var esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  var groups = [["\u4F01\u753B\u7533\u8ACB", ["E"]], ["\u4E8B\u524D\u5BE9\u67FB", ["G", "H", "J", "K", "L", "M"]], ["\u6700\u7D42\u5224\u65AD", []], ["\u958B\u50AC\u6E96\u5099", ["P", "Q", "S", "T", "U", "V", "W", "X"]], ["\u5F53\u65E5\u904B\u55B6", []], ["\u7D42\u4E86\u5831\u544A", ["AA"]]];
  var done2 = (s) => ["checked", "done-recorded"].includes(s.state);
  function routing(e) {
    const q = staffRoleQueue({ ...e, source: { statusRaw: e.sourceApproval || "" } }, role);
    if (role !== "concierge" && q.category !== "unknown") return { ...q, due: q.due || "\u671F\u9650\u672A\u8A18\u9332" };
    return role === "concierge" ? { label: "\u5BFE\u5FDC\u72B6\u6CC1\u3092\u78BA\u8A8D", question: e.next, due: "\u671F\u9650\u672A\u8A18\u9332", category: "unknown" } : role === "okami" ? { label: "\u76F8\u8AC7\u6BB5\u968E \u8981\u78BA\u8A8D", question: "\u5973\u5C06\u3078\u306E\u76F8\u8AC7\u306E\u6709\u7121\u30FB\u76F8\u8AC7\u5185\u5BB9\u30FB\u4E88\u5B9A\u3092\u78BA\u8A8D\u3059\u308B", due: "\u76F8\u8AC7\u671F\u9650\u672A\u8A18\u9332", category: "unknown" } : { label: "\u627F\u8A8D\u6BB5\u968E \u8981\u78BA\u8A8D", question: "\u30C8\u30E8\u30BF\u627F\u8A8D\u306E\u8981\u5426\u30FB\u4F9D\u983C\u72B6\u6CC1\u30FB\u5224\u65AD\u8A18\u9332\u3092\u78BA\u8A8D\u3059\u308B", due: "\u5224\u65AD\u671F\u9650\u672A\u8A18\u9332", category: "unknown" };
  }
  function stageLabel(e) {
    return e.stageHint === "\u6E96\u5099\u306E\u8A18\u9332\u3042\u308A" ? "\u6E96\u5099\uFF08\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\uFF09" : "\u66F8\u985E\u56DE\u53CE\uFF08\u8981\u78BA\u8A8D\uFF09";
  }
  function warning(e) {
    return e.steps.some((s) => s.column === "T" && s.state === "not-done-recorded") ? "\u6295\u5F71\u8CC7\u6599 \u672A" : !e.space ? e.eventTime ? "\u5834\u6240 \u7A7A\u6B04" : "\u6642\u9593\u30FB\u5834\u6240 \u7A7A\u6B04" : e.steps.some((s) => s.column === "X" && s.state === "unchecked") ? "POP \u672A\u30C1\u30A7\u30C3\u30AF" : "\u8A18\u9332\u3092\u78BA\u8A8D";
  }
  function countText(e) {
    const c = e.counts;
    return `\u6E08\u30FB\u30C1\u30A7\u30C3\u30AF ${c.doneOrChecked}/${c.total}\u3000\u672A ${c.explicitNotDone}\u3000\u672A\u30C1\u30A7\u30C3\u30AF ${c.unchecked}\u3000\u7A7A\u6B04 ${c.blank}`;
  }
  function header() {
    return `<header><b>Garraway F <span>\u30A4\u30D9\u30F3\u30C8\u7BA1\u7406</span></b><span class="private">\u516C\u958B\u30FB\u67B6\u7A7A\u30C7\u30FC\u30BF\u7248</span></header><p class="preview-notice">\u78BA\u8A8D\u7528\u306E\u67B6\u7A7A6\u6848\u4EF6\u3067\u3059\u3002\u5B9F\u30C7\u30FC\u30BF\u30FB\u4FDD\u5B58\u30FB\u901A\u77E5\u306F\u3042\u308A\u307E\u305B\u3093\u3002</p><nav aria-label="\u8868\u793A\u3059\u308B\u5F79\u5272">${Object.entries(roles).map(([k, v]) => `<button data-role="${k}" aria-pressed="${role === k}">${v}</button>`).join("")}</nav>`;
  }
  function queue() {
    const labels = role === "okami" ? [["requested", "\u76F8\u8AC7\u4E2D"], ["planned", "\u76F8\u8AC7\u4E88\u5B9A"], ["unknown", "\u8981\u78BA\u8A8D"]] : role === "toyota" ? [["requested", "\u627F\u8A8D\u5F85\u3061"], ["not-requested", "\u4F9D\u983C\u524D"], ["unknown", "\u8981\u78BA\u8A8D"]] : [["unknown", "\u78BA\u8A8D\u4E8B\u9805\u3042\u308A"]];
    return `<div class="queues"><button data-filter="all" aria-pressed="${filter === "all"}">\u5168\u4EF6 <b>${D.events.length}</b></button>${labels.map(([k, l]) => `<button data-filter="${k}" aria-pressed="${filter === k}">${l} <b>${k === "unknown" ? D.events.length : 0}</b></button>`).join("")}</div>`;
  }
  function list() {
    let events = D.events.filter((e) => filter === "all" || routing(e).category === filter);
    events.sort((a, b) => String(a[sort] || "").localeCompare(String(b[sort] || ""), "ja") * direction);
    return `<main><div class="heading"><h1>${role === "concierge" ? "\u9032\u884C\u3092\u78BA\u8A8D" : role === "okami" ? "\u76F8\u8AC7\u3092\u78BA\u8A8D" : "\u627F\u8A8D\u3092\u78BA\u8A8D"}</h1><small>\u540C\u3058${D.events.length}\u4EF6\u3092\u8868\u793A</small></div>${queue()}<p class="hint">${role === "concierge" ? "\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u306E\u6B8B\u4E8B\u9805\u3068\u3001\u6B21\u306B\u78BA\u8A8D\u3059\u308B\u3053\u3068" : role === "okami" ? "\u76F8\u8AC7\u4E2D\u30FB\u4E88\u5B9A\u306F\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u306B\u8A18\u9332\u306A\u3057\u3002\u8981\u78BA\u8A8D\u3068\u3057\u3066\u8868\u793A\u3002" : "\u300C\u958B\u50AC\u53EF\u300D\u3068\u30C8\u30E8\u30BF\u306E\u627F\u8A8D\u8A18\u9332\u306F\u5225\u3002\u9078\u629E\u6848\u4EF6\u306E\u627F\u8A8D\u5C65\u6B74\u306F\u8981\u78BA\u8A8D\u3002"}</p><div class="sort"><button data-sort="date">\u958B\u50AC\u65E5 ${sort === "date" ? direction === 1 ? "\u2191" : "\u2193" : ""}</button><button data-sort="title">\u30A4\u30D9\u30F3\u30C8\u540D ${sort === "title" ? direction === 1 ? "\u2191" : "\u2193" : ""}</button><button data-sort="concierge">\u62C5\u5F53 ${sort === "concierge" ? direction === 1 ? "\u2191" : "\u2193" : ""}</button></div><section aria-label="\u30A4\u30D9\u30F3\u30C8\u4E00\u89A7">${events.map((e) => `<button class="event-row" data-event="${e.id}"><span class="row-top"><strong>${esc(e.title)}</strong><b class="badge">${esc(role === "concierge" ? warning(e) : routing(e).label)}</b></span><span class="row-bottom"><span><b>${esc(e.date.slice(5).replace("-", "/"))}</b> ${esc(e.eventTime || "\u6642\u523B\u672A\u8A18\u9332")} \xB7 ${esc(stageLabel(e))}</span><span>${esc(role === "concierge" ? e.counts.doneOrChecked + "/16\u8A18\u9332\u6E08" : routing(e).due)}</span></span></button>`).join("") || '<p class="empty">\u3053\u306E\u533A\u5206\u3068\u78BA\u8A8D\u3067\u304D\u308B\u8A18\u9332\u306F\u3042\u308A\u307E\u305B\u3093\u3002<br>\u300C\u8981\u78BA\u8A8D\u300D\u306B\u30B5\u30F3\u30D7\u30EB\u304C\u672A\u8A18\u9332\u306E\u6848\u4EF6\u304C\u3042\u308A\u307E\u3059\u3002</p>'}</section><details class="list-help"><summary>\u5F79\u5272\u306E\u9055\u3044\u30FB\u8A18\u9332\u306E\u8AAD\u307F\u65B9</summary><p>\u30B3\u30F3\u30B7\u30A7\u30EB\u30B8\u30E5\u306F\u5B9F\u52D9\u306E\u9032\u884C\u3001\u5973\u5C06\u306F\u76F8\u8AC7\u3001\u30C8\u30E8\u30BF\u306F\u627F\u8A8D\u5224\u65AD\u3092\u512A\u5148\u3057\u307E\u3059\u3002\u5168\u54E1\u304C\u540C\u3058\u30A4\u30D9\u30F3\u30C8\u7BA1\u7406\u7968\u3092\u958B\u304D\u307E\u3059\u3002</p><p>\u5973\u5C06\u76F8\u8AC7\u4E2D\u3068\u76F8\u8AC7\u4E88\u5B9A\u3001\u30C8\u30E8\u30BF\u627F\u8A8D\u4F9D\u983C\u6E08\u3068\u4F9D\u983C\u524D\u306F\u5225\u7BA1\u7406\u3067\u3059\u3002\u4F9D\u983C\u3084\u4E88\u5B9A\u306E\u8A18\u9332\u304C\u306A\u3044\u3082\u306E\u3092\u3001\u627F\u8A8D\u5F85\u3061\u30FB\u76F8\u8AC7\u4E88\u5B9A\u306B\u306F\u3057\u307E\u305B\u3093\u3002</p><p>\u3053\u308C\u306F\u8868\u793A\u5207\u66FF\u3067\u3001\u672C\u4EBA\u8A8D\u8A3C\u3084\u627F\u8A8D\u6A29\u9650\u306E\u5207\u66FF\u3067\u306F\u3042\u308A\u307E\u305B\u3093\u3002\u5B9F\u969B\u306E\u627F\u8A8D\u30FB\u4FDD\u5B58\u306F\u884C\u3044\u307E\u305B\u3093\u3002</p></details>${footer()}</main>`;
  }
  function progress(e) {
    return `<section class="flow" aria-label="6\u5DE5\u7A0B\u306E\u30B5\u30F3\u30D7\u30EB\u8A18\u9332">${groups.map(([label, cols], i) => {
      const ss = e.steps.filter((s) => cols.includes(s.column));
      const known = ss.filter(done2).length;
      return `<button data-stage="${i}"><b>${label}</b><span>${i === 2 ? "\u53EF\u5426 " + esc(e.sourceApproval || "\u7A7A\u6B04") : ss.length ? known + "/" + ss.length + " \u8A18\u9332\u6E08" : "\u5B9F\u65BD\u672A\u78BA\u8A8D"}</span></button>`;
    }).join("")}</section>`;
  }
  function steps(e, cols) {
    return e.steps.filter((s) => !cols || cols.includes(s.column)).map((s) => `<div class="step"><span>${esc(s.label)}</span><b class="${done2(s) ? "done" : s.state === "not-done-recorded" ? "warn" : ""}">${esc(s.display)}</b><small>${esc(s.cell)} \xB7 \u30B5\u30F3\u30D7\u30EB\u8868\u8A18\uFF1A${esc(s.raw === null ? "\u7A7A\u6B04" : s.raw)}</small></div>`).join("");
  }
  function detail() {
    const e = D.events.find((x) => x.id === selected), r = routing(e);
    return `<main class="detail"><div class="detail-nav"><button data-back>\u2190 \u4E00\u89A7</button><span class="sample-caption">\u67B6\u7A7A\u30B5\u30F3\u30D7\u30EB\u306E\u7BA1\u7406\u7968</span></div><h1>${esc(e.title)}</h1><p class="event-date"><b>${esc(e.date)} ${esc(e.eventTime || "\u6642\u523B\u672A\u8A18\u9332")}</b><span>${esc(e.space || "\u30B9\u30DA\u30FC\u30B9\u672A\u8A18\u9332")} \xB7 \u958B\u50AC\u4E88\u5B9A</span></p>${progress(e)}<p class="progress-note">${countText(e)}<br>\u7A7A\u6B04\u306F\u672A\u5B9F\u65BD\u3092\u610F\u5473\u3057\u307E\u305B\u3093\u3002\u5DE5\u7A0B\u306E\u5B8C\u4E86\u306F\u65AD\u5B9A\u3057\u307E\u305B\u3093\u3002</p><section class="focus"><p class="eyebrow">${roles[role]}\u304C\u4ECA\u78BA\u8A8D\u3059\u308B\u3053\u3068</p><h2>${esc(r.question)}</h2><div class="focus-facts"><b>${esc(r.due)}</b><span>\u6B21\u306E\u62C5\u5F53\uFF1A\u8981\u78BA\u8A8D</span></div><p>${esc(role === "concierge" ? e.note : role === "okami" ? "\u554F\u3044\u5408\u308F\u305B\u5831\u544A\u3068\u3001\u5973\u5C06\u3078\u306E\u76F8\u8AC7\u5185\u5BB9\u30FB\u6BB5\u968E\u30FB\u4E88\u5B9A\u306E\u8A18\u9332\u3092\u78BA\u8A8D\u3057\u307E\u3059\u3002\u76F8\u8AC7\u6BB5\u968E\u306F\u672A\u8A18\u9332\u3067\u3059\u3002" : "\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u306E\u958B\u50AC\u53EF\u5426\uFF1A" + (e.sourceApproval || "\u7A7A\u6B04") + "\u3002\u627F\u8A8D\u8005\u30FB\u4F9D\u983C\u65E5\u30FB\u627F\u8A8D\u65E5\u6642\u306E\u8A18\u9332\u306F\u306A\u304F\u3001\u30C8\u30E8\u30BF\u627F\u8A8D\u6E08\u3068\u306F\u5224\u5B9A\u3057\u307E\u305B\u3093\u3002")}</p><button data-open-records class="primary">\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u3092\u78BA\u8A8D\u3059\u308B</button></section><div class="role-state"><span>\u5973\u5C06\u76F8\u8AC7 <b>\u6BB5\u968E\u672A\u8A18\u9332</b></span><span>\u30C8\u30E8\u30BF\u627F\u8A8D <b>\u6BB5\u968E\u672A\u8A18\u9332</b></span></div><details><summary>\u62C5\u5F53\u30FB\u65E5\u6642\u30FB\u5224\u65AD\u306E\u6839\u62E0</summary><dl><dt>\u62C5\u5F53\u30B3\u30F3\u30B7\u30A7\u30EB\u30B8\u30E5</dt><dd>${esc(e.concierge || "\u8A18\u9332\u306A\u3057")}</dd><dt>\u4E3B\u50AC\u8005</dt><dd>${esc(e.organizer || "\u8A18\u9332\u306A\u3057")}</dd><dt>\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u306E\u65E5\u6642</dt><dd>${esc(e.sourceDateRaw)}</dd><dt>\u65BD\u8A2D\u5229\u7528\u4E88\u5B9A</dt><dd>${esc(e.occupancyTime || "\u8A18\u9332\u306A\u3057")}</dd><dt>\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u306E\u958B\u50AC\u53EF\u5426</dt><dd>${esc(e.sourceApproval || "\u7A7A\u6B04")} (${esc(e.sourceCells.approval)})</dd></dl><p>\u958B\u50AC\u53EF\u5426\u306E\u8A18\u9332\u3068\u3001\u30C8\u30E8\u30BF\u306E\u627F\u8A8D\u5C65\u6B74\u306F\u5225\u3067\u3059\u3002\u6B21\u62C5\u5F53\u30FB\u4F5C\u696D\u671F\u9650\u30FB\u76F8\u8AC7\u671F\u9650\u30FB\u5224\u65AD\u671F\u9650\u306F\u672A\u8A18\u9332\u3067\u3059\u3002</p></details><details id="records"><summary>\u5DE5\u7A0B\u5225\u306E\u8A18\u9332\u30FB\u3069\u3053\u307E\u3067\u9032\u3093\u3060\u304B</summary><div class="stages">${groups.map(([l, cols], i) => `<button data-record-stage="${i}" aria-pressed="false">${l}</button>`).join("")}<button data-record-stage="all" aria-pressed="true">\u5168\u5DE5\u7A0B</button></div><div id="step-records">${steps(e)}</div></details><details><summary>\u958B\u50AC\u6E96\u5099\u30FB\u5F53\u65E5\u306E\u8A08\u753B</summary><p>\u672C\u756A ${esc(e.eventTime || "\u672A\u8A18\u9332")} \uFF0F \u65BD\u8A2D\u5229\u7528 ${esc(e.occupancyTime || "\u672A\u8A18\u9332")}</p>${steps(e, ["S", "T", "U", "V", "W", "X"])}</details><details><summary>\u7D42\u4E86\u5F8C\u306E\u5831\u544A</summary>${steps(e, ["AA"])}</details>${footer()}</main>`;
  }
  function footer() {
    return `<footer>\u3059\u3079\u3066\u67B6\u7A7A\u306E\u30B5\u30F3\u30D7\u30EB\u3067\u3059\u3002\u5B9F\u969B\u306E\u7533\u8ACB\u53D7\u4ED8\u30FB\u627F\u8A8D\u30FB\u4FDD\u5B58\u30FB\u81EA\u52D5\u540C\u671F\u30FB\u901A\u77E5\u306F\u884C\u3044\u307E\u305B\u3093\u3002<br>\u5F79\u5272\u306E\u8868\u793A\u5207\u66FF\u306F\u3001\u672C\u4EBA\u8A8D\u8A3C\u3084\u6A29\u9650\u306E\u5207\u66FF\u3067\u306F\u3042\u308A\u307E\u305B\u3093\u3002<br><a href="/">Garraway F \u30B5\u30A4\u30C8\u3078</a> \xB7 <a href="./">\u7533\u8ACB\u753B\u9762\u306E\u78BA\u8A8D\u7248\u3078</a></footer>`;
  }
  function render() {
    app.innerHTML = header() + (selected ? detail() : list());
    app.querySelectorAll("[data-role]").forEach((b) => b.onclick = () => {
      role = b.dataset.role;
      filter = "all";
      render();
    });
    app.querySelectorAll("[data-filter]").forEach((b) => b.onclick = () => {
      filter = b.dataset.filter;
      render();
    });
    app.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => {
      direction = sort === b.dataset.sort ? -direction : 1;
      sort = b.dataset.sort;
      render();
    });
    app.querySelectorAll("[data-event]").forEach((b) => b.onclick = () => {
      selected = b.dataset.event;
      render();
      window.scrollTo(0, 0);
    });
    app.querySelector("[data-back]")?.addEventListener("click", () => {
      selected = null;
      render();
      window.scrollTo(0, 0);
    });
    const openRecords = (i) => {
      const node = app.querySelector("#records");
      node.open = true;
      const e = D.events.find((x) => x.id === selected);
      app.querySelector("#step-records").innerHTML = steps(e, i === "all" ? null : groups[Number(i)][1]);
      app.querySelectorAll("[data-record-stage]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.recordStage === String(i))));
      if (i === "2") app.querySelector("#step-records").innerHTML = "<p>\u30B5\u30F3\u30D7\u30EB\u8A18\u9332\u306E\u958B\u50AC\u53EF\u5426\uFF1A" + esc(e.sourceApproval || "\u7A7A\u6B04") + "\u3002\u30C8\u30E8\u30BF\u627F\u8A8D\u306E\u5C65\u6B74\u306F\u672A\u8A18\u9332\u3067\u3059\u3002</p>";
      if (i === "4") app.querySelector("#step-records").innerHTML = "<p>\u5B9F\u958B\u50AC\u306E\u5B8C\u4E86\u8A18\u9332\u306F\u3042\u308A\u307E\u305B\u3093\u3002\u4E88\u5B9A\u6642\u9593\u304B\u3089\u5B9F\u65BD\u6E08\u307F\u3068\u306F\u5224\u65AD\u3057\u307E\u305B\u3093\u3002</p>";
      node.scrollIntoView({ block: "start" });
    };
    app.querySelector("[data-open-records]")?.addEventListener("click", () => openRecords("all"));
    app.querySelectorAll("[data-stage]").forEach((b) => b.onclick = () => openRecords(b.dataset.stage));
    app.querySelectorAll("[data-record-stage]").forEach((b) => b.onclick = () => openRecords(b.dataset.recordStage));
  }
  render();
})();
</script></body></html>
