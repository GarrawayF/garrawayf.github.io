.event-access{position:fixed;inset:0;z-index:1000;overflow:auto;display:grid;place-items:center;padding:20px;background:#fff2f7;color:#30212d;font:16px/1.55 system-ui,sans-serif}

.event-access button{margin-top:12px;background:#762546;color:#fff;font-weight:800;cursor:pointer}
.event-access button:disabled{opacity:.6}
.event-access :focus-visible{outline:3px solid #762546;outline-offset:2px}
.event-access [role=status]{min-height:1.25em;margin:7px 0 0;font-size:13px}
</style>
</head>
