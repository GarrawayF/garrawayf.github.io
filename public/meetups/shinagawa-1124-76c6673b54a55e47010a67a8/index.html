<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>X-meetup品川｜参加者用ボード｜Garraway F</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; background: #f4faff; color: #08090b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #258bff; outline-offset: 4px; }
    .shell { max-width: 1008px; padding: 20px max(22px, env(safe-area-inset-right)) 52px max(22px, env(safe-area-inset-left)); margin: 0 auto; }
    header { min-height: 55px; padding: 9px 20px; background: #fff; border: 1.5px solid #08090b; border-radius: 40px; box-shadow: 3px 3px 0 #08090b; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .brand { font: 900 26px/1 "Archivo Black", Arial, sans-serif; letter-spacing: -.075em; }
    .brand span { color: #e51771; }
    .home { font-size: 12px; font-weight: 700; padding: 6px 3px; }
    .home:hover { text-decoration: underline; }
    main { margin: 0 auto; max-width: 890px; }
    .intro { padding: clamp(40px, 8vw, 82px) 0 clamp(24px, 4.5vw, 43px); }
    .date { display: flex; align-items: center; gap: 11px; margin: 0 0 9px; font: 750 13px/1.4 "Archivo", Arial, sans-serif; letter-spacing: .09em; }
    .date::before { content:""; width: 28px; height: 3px; background:#ff2d86; }
    h1 { font-size: clamp(42px, 8.2vw, 88px); font-family: "Archivo Black", "Noto Sans JP", "Hiragino Sans", Arial, sans-serif; line-height: 1.2; font-weight: 900; letter-spacing: -.065em; margin: 0; overflow-wrap: anywhere; }
    .lead { font-size: clamp(16px, 2.2vw, 21px); margin: 9px 0 0; font-weight: 640; }
    .choices { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    .card { display: flex; flex-direction: column; align-items: flex-start; padding: clamp(23px, 3vw, 34px); border: 1.5px solid #08090b; border-radius: 15px; }
    .input { background: #fff; box-shadow: 4px 4px 0 #bde7ff; }
    .output { background: #101113; color: #fff; box-shadow: 4px 4px 0 #abd7ef; }
    h2 { font-size: clamp(24px, 3.2vw, 34px); line-height: 1.3; letter-spacing: -.05em; margin: 0 0 9px; }
    .card p { line-height: 1.7; margin: 0 0 24px; font-size: 15px; }
    .output p { color: #d2dbe0; }
    .join { display: inline-flex; align-items: center; justify-content: center; min-height: 49px; padding: 8px 20px; margin-top: auto; border: 1.5px solid #08090b; color: #fff; background: #08090b; border-radius: 7px; font-size: 16px; font-weight: 750; }
    .join:hover { color: #08090b; background: #bde7ff; }
    .teams { display: grid; width: 100%; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 5px; }
    .teams a, .all { display: flex; justify-content: center; align-items: center; min-height: 45px; border-radius: 6px; font-weight: 720; }
    .teams a { color: #fff; background: #222629; border: 1px solid #68727b; font-size: 16px; white-space: nowrap; }
    .all { width: 100%; margin-top: 9px; color: #08090b; background: #bde7ff; font-size: 16px; }
    .teams a:hover,.all:hover { color: #08090b; background: #fff; }
    @media(max-width: 650px) {
      .shell { padding: 14px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      header { min-height: 48px; padding: 8px 15px; }.brand { font-size: 23px; }
      .choices { grid-template-columns: 1fr; gap: 13px; }.card { padding: 22px; }.card p { margin-bottom: 17px; }
      .join { width: 100%; }.intro { padding: 38px 0 24px; }
    }
    @media(max-width: 360px) { .card { padding: 19px 15px; }.teams { gap: 4px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="Garraway F 公式ホームページ">Garraway <span>F</span></a>
      <a class="home" href="/">公式ホームへ</a>
    </header>
    <main>
      <section class="intro" aria-labelledby="title">
        <p class="date"><time datetime="2026-11-24">2026.11.24 TUE</time></p>
        <h1 id="title">X-meetup品川</h1>
        <p class="lead">品川で試してみたいことを、みんなで持ち寄る。</p>
      </section>
      <div class="choices">
        <section class="card input" aria-labelledby="participate">
          <h2 id="participate">参加する</h2>
          <p>自分のアイデアや、誰かの案に共感した理由を投稿できます。</p>
          <a class="join" href="https://shinagawa-discussion.delpiero.chatgpt.site/" rel="noreferrer nofollow">参加者用ボードを開く</a>
        </section>
        <section class="card output" aria-labelledby="project">
          <h2 id="project">アウトプットを見る</h2>
          <p>各班や会場全体の投稿を、大きな文字で表示します。</p>
          <nav class="teams" aria-label="班別アウトプット">
            <a href="https://shinagawa-discussion.delpiero.chatgpt.site/?view=screen&amp;team=A" rel="noreferrer nofollow" aria-label="A班のアウトプットを開く">A班</a>
            <a href="https://shinagawa-discussion.delpiero.chatgpt.site/?view=screen&amp;team=B" rel="noreferrer nofollow" aria-label="B班のアウトプットを開く">B班</a>
            <a href="https://shinagawa-discussion.delpiero.chatgpt.site/?view=screen&amp;team=C" rel="noreferrer nofollow" aria-label="C班のアウトプットを開く">C班</a>
            <a href="https://shinagawa-discussion.delpiero.chatgpt.site/?view=screen&amp;team=D" rel="noreferrer nofollow" aria-label="D班のアウトプットを開く">D班</a>
            <a href="https://shinagawa-discussion.delpiero.chatgpt.site/?view=screen&amp;team=E" rel="noreferrer nofollow" aria-label="E班のアウトプットを開く">E班</a>
          </nav>
          <a class="all" href="https://shinagawa-discussion.delpiero.chatgpt.site/?view=screen" rel="noreferrer nofollow">全体を投影する</a>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
